<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bezinho - Baixador MP3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111318;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1b1f27;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }
    p {
      margin: 0 0 20px;
      color: #9ca3af;
      font-size: 0.92rem;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #111318;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bezinho MP3</h1>
    <p>Cole o link e baixe o áudio direto no navegador.</p>
    <form action="/download" method="post">
      <input type="url" name="url" placeholder="https://..." required />
      <button type="submit">Baixar MP3</button>
    </form>
  </div>
</body>
</html>
